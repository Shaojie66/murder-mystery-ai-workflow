services:
  backend:
    build:
      context: ..
      dockerfile: murder_wizard_web/Dockerfile.backend
    container_name: murder-wizard-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/murder_wizard_web/backend
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - LLM_PROVIDER=${LLM_PROVIDER:-claude}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.io/anthropic}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M2.7}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:0.6b}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-ollama}
    volumes:
      # Persist projects data
      - murder_wizard_data:/root/.murder-wizard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: murder_wizard_web/frontend/Dockerfile
    container_name: murder-wizard-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  murder_wizard_data:
