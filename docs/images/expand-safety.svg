<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="900" height="300" rx="12" fill="#12110F"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8078"/></marker></defs><text x="30" y="38" font-size="18" fill="#F5F0E8" font-weight="700">expand：先在内存里做完，确认后才动你的作品</text><rect x="30" y="80" width="125" height="70" rx="8" fill="#1C1917" stroke="#3D3532"/><text x="92.5" y="109.0" text-anchor="middle" font-size="15" fill="#F5F0E8" font-weight="600">19 步生成</text><text x="92.5" y="131.0" text-anchor="middle" font-size="11.5" fill="#8A8078">内存候选</text><path d="M155 115 L173 115" stroke="#8A8078" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="173" y="80" width="125" height="70" rx="8" fill="#1C1917" stroke="#3D3532"/><text x="235.5" y="109.0" text-anchor="middle" font-size="15" fill="#F5F0E8" font-weight="600">逐步校验</text><text x="235.5" y="131.0" text-anchor="middle" font-size="11.5" fill="#8A8078">标题·事件标签·矩阵</text><path d="M298 115 L316 115" stroke="#8A8078" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="316" y="80" width="125" height="70" rx="8" fill="#1C1917" stroke="#3D3532"/><text x="378.5" y="109.0" text-anchor="middle" font-size="15" fill="#F5F0E8" font-weight="600">终闸</text><text x="378.5" y="131.0" text-anchor="middle" font-size="11.5" fill="#8A8078">原文是否逐字保留</text><path d="M441 115 L459 115" stroke="#8A8078" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="459" y="80" width="125" height="70" rx="8" fill="#1C1917" stroke="#C77A08"/><text x="521.5" y="109.0" text-anchor="middle" font-size="15" fill="#C77A08" font-weight="600">你确认</text><text x="521.5" y="131.0" text-anchor="middle" font-size="11.5" fill="#8A8078">默认“否”</text><path d="M584 115 L602 115" stroke="#8A8078" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="602" y="80" width="125" height="70" rx="8" fill="#1C1917" stroke="#3D3532"/><text x="664.5" y="109.0" text-anchor="middle" font-size="15" fill="#F5F0E8" font-weight="600">备份 8 个文件</text><text x="664.5" y="131.0" text-anchor="middle" font-size="11.5" fill="#8A8078">含 session.json</text><path d="M727 115 L745 115" stroke="#8A8078" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="745" y="80" width="125" height="70" rx="8" fill="#1C1917" stroke="#3D3532"/><text x="807.5" y="109.0" text-anchor="middle" font-size="15" fill="#F5F0E8" font-weight="600">写入 + 读回校验</text><text x="807.5" y="131.0" text-anchor="middle" font-size="11.5" fill="#8A8078">临时文件 + 替换</text><text x="30" y="188" font-size="13" fill="#4C8A5B" font-weight="600">任一步失败 → 作品原样保留；已通过的步骤命中缓存，重跑只重新调用失败的那一步</text><rect x="30" y="205" width="400" height="62" rx="8" fill="#1C1917" stroke="#9B1C1C"/><text x="230.0" y="230.0" text-anchor="middle" font-size="15" fill="#9B1C1C" font-weight="600">写入失败 / Ctrl+C</text><text x="230.0" y="252.0" text-anchor="middle" font-size="11.5" fill="#8A8078">自动从备份逐字节恢复；恢复也失败则列出 cp 命令</text><rect x="470" y="205" width="400" height="62" rx="8" fill="#1C1917" stroke="#3D3532"/><text x="670.0" y="230.0" text-anchor="middle" font-size="15" fill="#F5F0E8" font-weight="600">成功 ≠ 已审计</text><text x="670.0" y="252.0" text-anchor="middle" font-size="11.5" fill="#8A8078">只代表通过结构校验；请继续 audit 并通读新角色</text></svg>